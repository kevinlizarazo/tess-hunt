deciding_evidence = "Seeing-limited ground-based photometry on a predicted transit that resolves the neighbours (F1); high-resolution imaging that finds or bounds the companion (F2); the sector 110 to 113 light curves or a QLP redelivery of sector 99 for a second held-out season (F3). Under vet-v3 TRICERATOPS stays inconclusive on the high RUWE whatever the imaging shows, so a pass also needs a recorded decision on how imaging clears that blocker."
