deciding_evidence = "Ground-based transit photometry in two or more bands, which tells a diluted pair of small stars (deeper in the red) from a transit of the target and, at higher signal, a grazing shape from a flat-bottomed one; high-resolution imaging to bound a bound companion; precise radial velocities to bound a grazing body's mass (F1). No TESS sector is scheduled."
promotion = "The TCE matched is ExoMiner vetting_catalog_FFI 277774870-1-S56-69, a SPOC TCE that never became a TOI. Promoted by the maintainer in decision 0033 on the bar the nine shortlisted signals met in triage."
