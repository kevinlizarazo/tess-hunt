# Vetting criteria, version 3: vet-v2's sections and values unchanged, then the new sections, each
# with its decision (docs/decisions/0021 on).
# Changing a value after any result exists needs a docs/decisions entry first.

[depth]
core_fraction = 0.5             # central part of each transit used for depths

[signal_present]
min_snr = 7.0                   # combined core depth over its red-noise-inflated error (decision 0017)
min_points = 5

[red_noise]
# Moved from code, values unchanged (decision 0014).
exclude_width = 3.0             # transit durations around each transit left out of beta
min_bins = 20
kept_bin_fraction = 0.8         # of the fullest bin's cadences
min_cadences_per_bin = 3.0

[odd_even]
max_sigma = 3.0
min_points = 5

[secondary]
max_sigma = 3.0
min_points = 5

[sector_depth]
min_p_value = 0.001
min_points = 5

[holdout]
season_gap_days = 60.0
min_expected_snr = 4.0
min_sigma = 2.0
max_depth_tension = 3.0
min_points = 5
min_training_seasons = 2        # a period fitted on one season can't predict a season a year away
refit_resolutions = 5.0         # half-width of the refit's period grid, in BLS resolutions (decision 0014)
refit_points = 801
refit_duration_factors = [0.75, 1.0, 1.25]

[fit]
walkers = 32
steps = 5000
burn = 2000
window_half_width_durations = 3.0   # cadences within this many durations of mid-transit (decision 0015)
seed = 1
min_points = 20                 # cadences near transit needed to fit (decision 0014)
min_acceptance = 0.01           # below this the walkers never moved (decision 0014)
max_rp_rs = 1.0                 # the Rp/R* prior bound; vet-v1's code had 0.5 (decision 0018)

[shape]
max_grazing_probability = 0.5

[density]
max_sigma = 3.0
default_log_rho_error = 0.1     # dex, when the TIC gives no density error

[radius]
max_rearth = 22.0               # LEO-Vetter's limit for a planet (decision 0018)

[novelty]
neighbour_arcmin = 2.5
harmonics = [1.0, 0.5, 2.0, 0.3333333333333333, 3.0]
inconclusive_kinds = ["tce"]    # a match only to SPOC TCEs or ExoMiner rows (decision 0013)

[masks]
sources = ["TOI", "CTOI", "archive"]   # the search's [detrend] mask_sources; other rows are novelty evidence (0021)

[timing]
exclude_timing_suspect = true          # every check and fit leaves out sectors fetch flagged (0022)

[families]
pdcsap = ["SPOC", "TESS-SPOC"]         # crowding-corrected (0023)
qlp = ["QLP"]
fit = "pdcsap"                         # the family both fits use
